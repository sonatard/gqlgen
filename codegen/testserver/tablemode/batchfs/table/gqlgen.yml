schema:
  - ../*.graphql
skip_validation: true
exec:
  layout: follow-schema
  dir: .
  package: table
  mode: table
model:
  filename: models_gen.go
  package: table
autobind:
  - github.com/99designs/gqlgen/codegen/testserver/tablemode/batchfs/model
models:
  Dog:
    fields:
      batchProp:
        resolver: true
        batch: true
  Cat:
    fields:
      batchProp:
        resolver: true
        batch: true
