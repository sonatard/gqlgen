# The plugin of TestTableModePluginUnmarshalers calls the unmarshaler of Hello.name, after
# the federation plugin asked for those of the keys.
extend schema @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key"])

type Query {
  hello: Hello
}

type Hello @key(fields: "name") {
  name: String!
}
