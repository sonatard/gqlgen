schema:
  - "*.graphql"
skip_validation: true
exec:
  filename: generated.go
  package: execbehavior
  worker_limit: 2
model:
  filename: models-gen.go
  package: execbehavior
autobind:
  - github.com/99designs/gqlgen/codegen/testserver/execbehavior

models:
  MarkedChild:
    fields:
      resolvedValue:
        resolver: true
      node:
        resolver: true
  LimitedItem:
    fields:
      slow:
        resolver: true
  ErrorProbe:
    fields:
      failing:
        resolver: true
      failingNonNull:
        resolver: true
      withExtensions:
        resolver: true
      multiple:
        resolver: true
      valueAndError:
        resolver: true
  DeferItem:
    fields:
      slow:
        resolver: true
      failing:
        resolver: true
      nonNullFailing:
        resolver: true
