# Fields that resolve concurrently may be deferred. A deferred field is left out of the
# first response and sent in a later one, grouped by the label of its fragment.
type DeferItem {
  id: Int!
  slow: String!
  failing: String
  nonNullFailing: String!
}

extend type Query {
  deferItem: DeferItem
  deferItems: [DeferItem!]!
}
